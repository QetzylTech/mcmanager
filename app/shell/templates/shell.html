<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCManager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='shell.css') }}">
  <script defer src="{{ url_for('static', filename='shell.js') }}"></script>
  <script defer src="{{ url_for('static', filename='stream_client.js') }}"></script>
</head>
<body>
  <nav aria-label="Primary">
    <div class="brand">MCManager</div>
    <div class="nav-section">
      {% for page in pages %}
      <a class="ui-button ui-button-general{% if page.slug == active %} is-active{% endif %}" href="/pages/{{ page.slug }}" data-page="{{ page.slug }}">{{ page.title }}</a>
      {% endfor %}
    </div>
  </nav>
  <main data-active-page="{{ active }}">
    <article class="pane">
      <header class="pane-title-area">
        <div>
          <h1>{{ pages|selectattr('slug', 'equalto', active)|map(attribute='title')|first }}</h1>
          <p class="muted">Persistent manager shell</p>
        </div>
        <button class="ui-button ui-button-blue" type="button" data-refresh>Refresh</button>
      </header>
      <div class="pane-content-area">
        <section class="module-grid" data-page-root>
          <div class="list-surface" data-loading>Loading page module...</div>
        </section>
      </div>
    </article>
  </main>
</body>
</html>
