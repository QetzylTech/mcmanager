[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
check_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "app.domain.*",
    "app.services.*",
    "app.ports.*",
    "app.commands.*",
]
strict = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-fail-under=80"
markers = [
    "conformance: Document 13 C1–C14 adapter conformance suite",
]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "app layers"
type = "layers"
modules = [
    "app.web",
    "app.commands",
    "app.services",
    "app.ports",
    "app.infrastructure",
    "app.platform",
]
layers = [
    "app.web",
    "app.commands",
    "app.services",
    "app.ports",
    "app.infrastructure",
    "app.platform",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "leaf platform"
type = "modules"
modules = ["app.platform"]
ignore_imports = ["app.services", "app.web", "app.commands"]
